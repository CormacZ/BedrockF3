name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Force all JavaScript actions to run on the Node.js 24 runtime, which is the
# supported runtime going forward. Several community actions (ilammy/msvc-dev-cmd,
# xmake-io/github-action-setup-xmake, softprops/action-gh-release) are still on
# Node 20 majors; this env var is the documented override until they ship their
# own Node 24 majors. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    name: Windows release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache xmake build
        uses: actions/cache@v5
        with:
          path: |
            .xmake
            bin
          key: ${{ runner.os }}-xmake-${{ hashFiles('xmake.lua', 'src/**/*.cpp', 'src/**/*.h', 'tooth.json', 'manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-xmake-

      - name: Configure
        shell: cmd
        run: xmake f -p windows -a x64 -m release -y

      - name: Build
        shell: cmd
        run: xmake -y

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path bin/BedrockF3/BedrockF3.dll)) {
              Write-Error "BedrockF3.dll was not produced"
              exit 1
          }
          if (-not (Test-Path bin/BedrockF3/manifest.json)) {
              Write-Error "manifest.json was not produced"
              exit 1
          }

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path bin/BedrockF3/* -DestinationPath BedrockF3-client-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: BedrockF3-client-windows-x64
          path: BedrockF3-client-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
